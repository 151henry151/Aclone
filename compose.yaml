services:
  aclone:
    build:
      context: .
      args:
        BASE_PATH: ${BASE_PATH:-/}
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - parish:/app/var
    restart: unless-stopped
    stop_grace_period: 20s
volumes:
  parish:
