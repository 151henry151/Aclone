services:
  aclone:
    build:
      context: .
      args:
        BASE_PATH: ${BASE_PATH:-/}
    environment:
      GALAXY_NAME: ${GALAXY_NAME:-Aclone galaxy}
      GALAXY_URL: ${GALAXY_URL:-}
      GALAXY_PEERS_FILE: ${GALAXY_PEERS_FILE:-}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      NPC_POPULATION_ENABLED: ${NPC_POPULATION_ENABLED:-false}
      NPC_TIME_ZONE: ${NPC_TIME_ZONE:-America/New_York}
      NPC_ENABLED: ${NPC_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NPC_BAKER_ENABLED: ${NPC_BAKER_ENABLED:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      NPC_BAKER_ID: ${NPC_BAKER_ID:-toby}
      NPC_BAKER_NAME: ${NPC_BAKER_NAME:-Toby Finch}
      NPC_BAKER_WORLD: ${NPC_BAKER_WORLD:-}
      NPC_BAKER_MODEL: ${NPC_BAKER_MODEL:-claude-haiku-4-5-20251001}
      NPC_BAKER_PERSONALITY: ${NPC_BAKER_PERSONALITY:-}
      NPC_BAKER_INTERVAL_MS: ${NPC_BAKER_INTERVAL_MS:-15000}
      NPC_BAKER_ACTIVE_ALONE: ${NPC_BAKER_ACTIVE_ALONE:-false}
      NPC_BAKER_INPUT_USD_PER_MILLION: ${NPC_BAKER_INPUT_USD_PER_MILLION:-}
      NPC_BAKER_OUTPUT_USD_PER_MILLION: ${NPC_BAKER_OUTPUT_USD_PER_MILLION:-}
      NPC_FARMER_ENABLED: ${NPC_FARMER_ENABLED:-false}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      JEV_API_KEY: ${JEV_API_KEY:-}
      NPC_FARMER_ID: ${NPC_FARMER_ID:-rowan}
      NPC_FARMER_NAME: ${NPC_FARMER_NAME:-Rowan Field}
      NPC_FARMER_WORLD: ${NPC_FARMER_WORLD:-}
      NPC_FARMER_MODEL: ${NPC_FARMER_MODEL:-}
      NPC_FARMER_CHAT_MODEL: ${NPC_FARMER_CHAT_MODEL:-claude-haiku-4-5-20251001}
      NPC_FARMER_PERSONALITY: ${NPC_FARMER_PERSONALITY:-}
      NPC_FARMER_INTERVAL_MS: ${NPC_FARMER_INTERVAL_MS:-15000}
      NPC_FARMER_ACTIVE_ALONE: ${NPC_FARMER_ACTIVE_ALONE:-false}
      NPC_FARMER_INPUT_USD_PER_MILLION: ${NPC_FARMER_INPUT_USD_PER_MILLION:-}
      NPC_FARMER_OUTPUT_USD_PER_MILLION: ${NPC_FARMER_OUTPUT_USD_PER_MILLION:-}
      NPC_FARMER_CHAT_INPUT_USD_PER_MILLION: ${NPC_FARMER_CHAT_INPUT_USD_PER_MILLION:-}
      NPC_FARMER_CHAT_OUTPUT_USD_PER_MILLION: ${NPC_FARMER_CHAT_OUTPUT_USD_PER_MILLION:-}
      NPC_JEV_MODEL: ${NPC_JEV_MODEL:-jev-1.13.0}
      NPC_JEV_INPUT_USD_PER_MILLION: ${NPC_JEV_INPUT_USD_PER_MILLION:-}
      NPC_JEV_OUTPUT_USD_PER_MILLION: ${NPC_JEV_OUTPUT_USD_PER_MILLION:-}
      NPC_INDEPENDENT_ENABLED: ${NPC_INDEPENDENT_ENABLED:-false}
      NPC_INDEPENDENT_ID: ${NPC_INDEPENDENT_ID:-elias}
      NPC_INDEPENDENT_NAME: ${NPC_INDEPENDENT_NAME:-Elias Vale}
      NPC_INDEPENDENT_WORLD: ${NPC_INDEPENDENT_WORLD:-}
      NPC_INDEPENDENT_PERSONALITY: ${NPC_INDEPENDENT_PERSONALITY:-}
      NPC_INDEPENDENT_INTERVAL_MS: ${NPC_INDEPENDENT_INTERVAL_MS:-15000}
      NPC_INDEPENDENT_ACTIVE_ALONE: ${NPC_INDEPENDENT_ACTIVE_ALONE:-false}
      NPC_INDEPENDENT_CHAT_MODEL: ${NPC_INDEPENDENT_CHAT_MODEL:-claude-haiku-4-5-20251001}
      NPC_INDEPENDENT_CHAT_INPUT_USD_PER_MILLION: ${NPC_INDEPENDENT_CHAT_INPUT_USD_PER_MILLION:-}
      NPC_INDEPENDENT_CHAT_OUTPUT_USD_PER_MILLION: ${NPC_INDEPENDENT_CHAT_OUTPUT_USD_PER_MILLION:-}
      NPC_ID: ${NPC_ID:-mabel}
      NPC_NAME: ${NPC_NAME:-Mabel Reed}
      NPC_WORLD: ${NPC_WORLD:-puddlewick}
      NPC_MODEL: ${NPC_MODEL:-gpt-4.1-mini}
      NPC_ACTIVE_ALONE: ${NPC_ACTIVE_ALONE:-false}
      NPC_INTERVAL_MS: ${NPC_INTERVAL_MS:-15000}
      NPC_MONTHLY_USD: ${NPC_MONTHLY_USD:-20}
      NPC_DAILY_USD: ${NPC_DAILY_USD:-0.60}
      NPC_CALLS_PER_HOUR: ${NPC_CALLS_PER_HOUR:-120}
      NPC_INPUT_USD_PER_MILLION: ${NPC_INPUT_USD_PER_MILLION:-0.4}
      NPC_OUTPUT_USD_PER_MILLION: ${NPC_OUTPUT_USD_PER_MILLION:-1.6}
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - parish:/app/var
    restart: unless-stopped
    stop_grace_period: 20s
volumes:
  parish:
