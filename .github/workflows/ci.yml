# SPDX-License-Identifier: GPL-3.0-or-later
name: Check Aclone
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npx tsc --noEmit
      # Leave CPU time for the real worker deadlines exercised by the tests.
      - run: node --import tsx --test --test-concurrency=2 tests/*.test.ts

  browser:
    # A single laptop GPU executes the complete main suite serially. PRs retain
    # hosted smoke checks below and can never select this runner through this job.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == '151henry151/Aclone'
    runs-on: [self-hosted, linux, x64, aclone-gpu]
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: root-1
            base_path: ''
            url: http://127.0.0.1:3000/
            tests: --shard=1/8
          - name: root-2
            base_path: ''
            url: http://127.0.0.1:3000/
            tests: --shard=2/8
          - name: root-3
            base_path: ''
            url: http://127.0.0.1:3000/
            tests: --shard=3/8
          - name: root-4
            base_path: ''
            url: http://127.0.0.1:3000/
            tests: --shard=4/8
          - name: root-5
            base_path: ''
            url: http://127.0.0.1:3000/
            tests: --shard=5/8
          - name: root-6
            base_path: ''
            url: http://127.0.0.1:3000/
            tests: --shard=6/8
          - name: root-7
            base_path: ''
            url: http://127.0.0.1:3000/
            tests: --shard=7/8
          - name: root-8
            base_path: ''
            url: http://127.0.0.1:3000/
            tests: --shard=8/8
    name: Browser (${{ matrix.name }})
    env:
      BASE_PATH: ${{ matrix.base_path }}
      TEST_URL: ${{ matrix.url }}
      DATA_DIR: /tmp/aclone-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.name }}
      TEST_GPU: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install chromium
      - name: Require hardware WebGL
        run: node --import tsx scripts/verify-ci-gpu.ts
      - uses: actions/upload-artifact@v4
        with:
          name: gpu-renderer-${{ matrix.name }}
          path: test-results/gpu-renderer.json
      - name: Check public website
        if: matrix.name == 'root-1'
        run: npm run check:website
      - name: Start disposable game server
        run: npm start > /tmp/aclone.log 2>&1 &
      - name: Start subpath proxy
        if: matrix.base_path != ''
        run: UPSTREAM_PORT=3000 PROXY_PORT=3013 node --import tsx scripts/test-proxy.ts > /tmp/aclone-proxy.log 2>&1 &
      - name: Wait for health endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 2 "${TEST_URL}api/health"; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/aclone.log
          exit 1
      # Keep the existing shard and individual test deadlines. The laptop executes
      # one shard at a time; no competing CI renderer distorts graphics benchmarks.
      # Playwright's deadline leaves time to upload diagnostics before the job limit.
      - run: npm run test:e2e -- --global-timeout=1200000 ${{ matrix.tests }}
      - uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: browser-test-evidence-${{ matrix.name }}
          path: |
            test-results/
            /tmp/aclone.log
            /tmp/aclone-proxy.log

  browser-smoke:
    name: Software browser (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: root
            base_path: ''
            url: http://127.0.0.1:3000/
          - name: subpath
            base_path: /aclone
            url: http://127.0.0.1:3013/aclone/
    env:
      BASE_PATH: ${{ matrix.base_path }}
      TEST_URL: ${{ matrix.url }}
      DATA_DIR: /tmp/aclone-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm start > /tmp/aclone.log 2>&1 &
      - name: Start subpath proxy
        if: matrix.base_path != ''
        run: UPSTREAM_PORT=3000 PROXY_PORT=3013 node --import tsx scripts/test-proxy.ts > /tmp/aclone-proxy.log 2>&1 &
      - name: Wait for health endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 2 "${TEST_URL}api/health"; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/aclone.log
          exit 1
      - run: npm run test:e2e -- --global-timeout=1200000 tests/browser/game.spec.ts tests/browser/expansion.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: browser-test-evidence-software-${{ matrix.name }}
          path: |
            test-results/
            /tmp/aclone.log
            /tmp/aclone-proxy.log
